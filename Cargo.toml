[package]
name = "myne"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Editor for groff documents written with the mom macros, with a live PDF preview"
rust-version = "1.92"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
sourceview5 = { version = "0.11", features = ["v5_12"] }
poppler-rs = { version = "0.26", features = ["v0_82"] }
cairo-rs = "0.22"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gio = "0.22"
glib = "0.22"
anyhow = "1"
thiserror = "2"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[build-dependencies]
glib-build-tools = "0.22"
